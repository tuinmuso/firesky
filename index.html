<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15110d">
<meta name="description" content="Fire Sky & Friends Prestige Production Auction, 30 January 2027, 11:00. Tap to open the sale catalogue.">
<meta property="og:type" content="website">
<meta property="og:title" content="Fire Sky & Friends Prestige Production Auction">
<meta property="og:description" content="Tap to open the sale catalogue. 30 January 2027, 11:00.">
<meta property="og:image" content="https://tuinmuso.github.io/firesky/og.jpg">
<meta property="og:url" content="https://tuinmuso.github.io/firesky/">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fire Sky">
<title>Fire Sky & Friends Catalogue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500;1,6..96,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first auction catalogue. Cover hero, lot feed, lot sheet styled like the printed catalogue (arch photos, horn figures, pedigree), bottom tabs. */
:root{
  /* Fire Sky Ankole: flame orange, ember black, catalogue cream */
  --bg:#f6f1e8; --surface:#fffdf8; --sunk:#efe7da; --fg:#1c1611; --muted:#6f6355; --line:#e2d7c5;
  --fire:#e9761c; --fire-ink:#ffffff; --fire-soft:#fbe3cd; --night:#15110d; --night-fg:#f6efe4; --night-muted:#b9aa98;
  --good:#3b7a4a; --warn:#a8721a;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#110d0a; --surface:#1b1511; --sunk:#251d17; --fg:#f3ebdf; --muted:#a89a8a; --line:#30271f;
  --fire:#f28a33; --fire-ink:#1a0f06; --fire-soft:#3a2614; --night:#0c0907; --night-fg:#f6efe4; --night-muted:#b9aa98;
  --good:#7fc28e; --warn:#e2b04a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#110d0a; --surface:#1b1511; --sunk:#251d17; --fg:#f3ebdf; --muted:#a89a8a; --line:#30271f;
  --fire:#f28a33; --fire-ink:#1a0f06; --fire-soft:#3a2614; --night:#0c0907; --night-fg:#f6efe4; --night-muted:#b9aa98;
  --good:#7fc28e; --warn:#e2b04a; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.serif{font-family:var(--display);font-style:italic;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 12px}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-row img{width:46px;height:auto}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand b{font-family:var(--display);font-style:italic;font-weight:500;font-size:20px;line-height:1.1}
.logo-l{display:block}.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.demo{font-size:12px;background:var(--sunk);color:var(--muted);border-radius:8px;padding:7px 10px;margin-bottom:14px}

/* cover */
.cover{position:relative;border-radius:20px;overflow:hidden;background:var(--night);color:var(--night-fg);min-height:380px;display:flex;flex-direction:column;justify-content:flex-end}
.cover>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,9,7,.15) 0%,rgba(12,9,7,.25) 35%,rgba(12,9,7,.92) 78%)}
.cover .in{position:relative;z-index:1;padding:20px;padding-top:120px;display:flex;flex-direction:column;gap:6px}
.cover .lg{width:84px;margin-bottom:auto}
.cover .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--fire)}
.cover h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:32px;line-height:1.08}
.cover p{margin:0;color:var(--night-muted);font-size:14px}
.cover .count{display:flex;align-items:baseline;gap:8px;margin-top:8px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
.cover .count b{font-family:var(--display);font-size:40px;font-weight:500;line-height:1;color:#fff}
.cover .count span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--fire)}
.cover .toplogo{position:absolute;top:16px;left:16px;z-index:1;width:76px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:8px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.media{position:relative;display:block;width:100%;aspect-ratio:3/2;max-width:100%;border:0;padding:0;background:var(--sunk);overflow:hidden;text-align:left}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .lotno{position:absolute;left:0;bottom:0;z-index:2;background:var(--fire);color:var(--fire-ink);padding:6px 12px 6px 14px;border-top-right-radius:14px;display:flex;align-items:baseline;gap:6px}
.media .lotno small{font-size:10px;letter-spacing:.16em;font-weight:700}
.media .lotno b{font-family:var(--display);font-style:italic;font-weight:500;font-size:22px;line-height:1}
.media .play{position:absolute;right:12px;bottom:12px;z-index:2;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.media .play::after{content:"";border-left:13px solid #1c1611;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.media .tag{position:absolute;right:10px;top:10px;z-index:2;background:rgba(12,9,7,.62);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:6px}
.media .tag.live{background:#c2341b}
.media .cap{position:absolute;inset:auto 0 0 0;z-index:1;padding:40px 70px 14px 14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.65));color:#fff;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s}
.media.playing .cap{opacity:1}
.media .bar{position:absolute;left:0;top:0;height:3px;background:var(--fire);z-index:3;width:0}
.media.playing .bar{animation:prog 6s linear forwards}
@keyframes prog{to{width:100%}}
@media (prefers-reduced-motion:reduce){.media.playing .bar{animation:none;width:100%}}
.ph{position:absolute;inset:10px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;font-weight:600;padding:10px}
.ph svg{width:34px;height:34px;stroke:var(--muted);fill:none;stroke-width:1.6;display:block;margin:0 auto 6px}

.cbody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cname{font-family:var(--display);font-style:italic;font-weight:500;font-size:26px;line-height:1.05}
.cid{font-size:12px;color:var(--muted);letter-spacing:.02em}
.tagline{font-family:var(--display);font-style:italic;color:var(--fire);font-size:15px}
.heart{border:1px solid var(--line);background:none;border-radius:999px;width:42px;height:42px;display:grid;place-items:center;flex-shrink:0}
.heart svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:2}
.heart[aria-pressed="true"]{background:var(--fire);border-color:var(--fire)}
.heart[aria-pressed="true"] svg{fill:var(--fire-ink);stroke:var(--fire-ink)}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fig{background:var(--sunk);border-radius:10px;padding:8px 9px;min-width:0}
.fig b{display:block;font-family:var(--display);font-weight:500;font-size:17px;line-height:1.15;white-space:nowrap}
.fig i{font-style:normal;font-size:11px;color:var(--muted);display:block;line-height:1.25}
.watch{font-size:13px;color:var(--fire);font-weight:600;display:flex;align-items:center;gap:6px}
.watch::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fire)}
.open{margin-top:auto;border:0;background:var(--fg);color:var(--bg);border-radius:10px;padding:11px;font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(12,9,7,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;z-index:21;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;flex-direction:column;gap:16px}
.grab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.sheet .media{border-radius:16px;aspect-ratio:4/3}
.story p{margin:0 0 8px}
.ticks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ticks li{padding-left:22px;position:relative;font-size:14px}
.ticks li::before{content:"";position:absolute;left:2px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--fire)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sec h3{font-family:var(--display);font-style:italic;font-weight:500;font-size:22px;color:var(--fire)}
.sec .hint{font-size:12px;color:var(--muted);margin:-8px 0 0}
.dark{background:var(--night);border-color:var(--night);color:var(--night-fg)}
.dark .muted{color:var(--night-muted)}
.parents{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.parents{grid-template-columns:1fr}}
.par{display:flex;flex-direction:column;gap:6px;min-width:0}
.arch{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:999px 999px 12px 12px;overflow:hidden;background:#2a211a}
.arch img{width:100%;height:100%;object-fit:cover;object-position:center bottom}
.arch .badge{position:absolute;right:8px;bottom:8px;width:56px;height:56px;border-radius:50%;background:var(--fire);color:#fff;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:14px;line-height:1.05}
.arch .badge small{display:block;font-family:var(--body);font-size:8px;letter-spacing:.12em}
.par .role{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--fire)}
.par .pn{font-family:var(--display);font-size:20px;line-height:1.1}
.par .pid{font-size:11px;color:var(--night-muted)}
.par .pt{font-size:13px;color:var(--night-muted)}
.gen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gen div{min-width:0;text-align:center;font-size:11px}
.gen .arch{aspect-ratio:3/4}
.gen b{display:block;font-family:var(--display);font-weight:500;font-size:15px;color:var(--night-fg)}
.gen span{color:var(--fire);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.data{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.data div{background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:13px;min-width:0}
.data i{font-style:normal;display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.data .full{grid-column:1/-1}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.saved{font-size:12px;color:var(--good);min-height:16px}
.q{border-left:3px solid var(--line);padding-left:10px;font-size:14px}
.q b{font-weight:600}
.q .a{margin-top:4px}
.q .a span{color:var(--fire);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.q .pend{margin-top:4px;color:var(--warn);font-size:12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--fire);border-color:var(--fire);color:var(--fire-ink)}
.btn.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.sharebox{font-size:13px;background:var(--sunk);padding:10px;border-radius:10px;word-break:break-word}

.tray{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tray button{background:var(--fire);color:var(--fire-ink);border:0;border-radius:999px;padding:11px 18px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable th,.ctable td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ctable th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;width:30%}
.ctable td{font-variant-numeric:tabular-nums}
.ctable td.win{color:var(--good);font-weight:700}

.live{background:var(--surface);border:2px solid #c2341b;border-radius:18px;overflow:hidden}
.live .media{aspect-ratio:16/9}
.live .in{padding:14px;display:flex;flex-direction:column;gap:8px}
.pulse{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c2341b}
.pulse::before{content:"";width:10px;height:10px;border-radius:50%;background:#c2341b;animation:pu 1.2s infinite}
@keyframes pu{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse::before{animation:none}}
.bid{font-family:var(--display);font-size:36px;font-weight:500;line-height:1}
.res{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.res .n{font-family:var(--display);font-style:italic;color:var(--fire);font-size:17px}
.res .p{font-weight:700;color:var(--good)}
.res .p.wait{color:var(--muted);font-weight:500}
.cta{display:block;text-align:center;text-decoration:none;background:var(--fire);color:var(--fire-ink);border-radius:10px;padding:12px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:30px;font-weight:500;line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,130px) 1fr 34px;gap:10px;align-items:center;font-size:13px}
.barrow .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--fire);border-radius:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 10px}
.secthead h2{font-family:var(--display);font-style:italic;font-weight:500;font-size:28px}
.secthead span{font-size:13px;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.nav button[aria-current="page"]{color:var(--fire)}
.nav .badge{background:var(--fire);color:var(--fire-ink);border-radius:999px;font-size:10px;padding:0 5px;margin-left:2px}

/* ---------- buyer-friendly layer ---------- */
body.sim .wrap>.top, body.sim .wrap>.demo, body.sim .nav, body.sim .tray, body.sim .nudge{display:none!important}
body.big .wrap, body.big .sheet-in{zoom:1.18}
.tools{display:flex;gap:6px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--fg)}
.pill[aria-pressed="true"]{background:var(--fire);border-color:var(--fire);color:var(--fire-ink)}
.demo button{border:0;background:none;color:var(--fire);font-weight:700;padding:0;text-decoration:underline;font-size:12px}
.pdfbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:10px;color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.pdfbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* WhatsApp preview (fixed WhatsApp colours, it imitates the app) */
.simnote{background:var(--sunk);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.simnote b{font-family:var(--display);font-style:italic;font-weight:500;font-size:20px}
.simnote .row{align-items:center}
.phone{max-width:420px;margin:0 auto;border-radius:28px;overflow:hidden;border:8px solid #1d1d1d;background:#efeae2;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.wa-h{background:#075e54;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 12px}
.wa-h .av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.wa-h .av img{width:32px;height:auto}
.wa-h b{display:block;font-size:16px;font-weight:600}
.wa-h small{font-size:12px;opacity:.85}
.wa-body{padding:14px 10px 18px;display:flex;flex-direction:column;gap:8px;background-color:#efeae2;background-image:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1px);background-size:14px 14px;min-height:430px}
.wa-day{align-self:center;background:#fff;color:#54656f;font-size:12px;padding:4px 10px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bub{align-self:flex-start;max-width:88%;background:#fff;color:#111b21;border-radius:0 10px 10px 10px;padding:5px 5px 6px;box-shadow:0 1px 1px rgba(0,0,0,.12);font-size:14.5px;line-height:1.4}
.bub p{margin:4px 6px 2px}
.bub .tm{display:block;text-align:right;font-size:11px;color:#667781;margin:0 4px}
.bub a.wl{color:#027eb5;text-decoration:none;word-break:break-all}
.lp{display:block;width:100%;border:0;padding:0;background:#f5f6f6;border-radius:8px;overflow:hidden;text-align:left;cursor:pointer}
.lp img{width:100%;aspect-ratio:1.91/1;object-fit:cover;display:block}
.lp span{display:block;padding:8px 10px 10px;color:#111b21}
.lp strong{display:block;font-size:14px}
.lp em{font-style:normal;display:block;font-size:13px;color:#54656f;margin-top:2px}
.lp small{display:block;font-size:12px;color:#8696a0;margin-top:4px}
.tapme{position:relative}
.tapme::after{content:"";position:absolute;right:14px;top:14px;width:46px;height:46px;border-radius:50%;background:rgba(233,118,28,.35);border:3px solid #e9761c;animation:tap 1.6s infinite}
@keyframes tap{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.tapme::after{animation:none}}
.doc{display:flex;align-items:center;gap:10px;background:#f5f6f6;border-radius:8px;padding:10px;color:#111b21;text-decoration:none}
.doc .ic{width:34px;height:42px;border-radius:4px;background:#e53935;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.doc strong{display:block;font-size:14px;font-weight:600}
.doc small{font-size:12px;color:#667781}
.wa-in{background:#f0f2f5;padding:8px 10px;display:flex;gap:8px;align-items:center}
.wa-in span{flex:1;background:#fff;border-radius:20px;padding:9px 14px;color:#8696a0;font-size:14px}
.wa-in i{width:40px;height:40px;border-radius:50%;background:#00a884;flex-shrink:0}

/* welcome + install */
.welcome h2,.inst h2{font-family:var(--display);font-style:italic;font-weight:500;font-size:30px;line-height:1.1}
.lead{font-size:17px;margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:17px;font-weight:500;line-height:1.3}
.steps .ico{width:52px;height:52px;border-radius:14px;background:var(--fire-soft);display:grid;place-items:center}
.steps .ico svg{width:28px;height:28px;stroke:var(--fire);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big-btn{border:0;background:var(--fire);color:var(--fire-ink);border-radius:14px;padding:16px;font-size:18px;font-weight:700;width:100%}
.ghost-btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:16px;font-weight:600;width:100%;color:var(--fg)}
.reassure{font-size:14px;color:var(--muted);text-align:center;margin:0}
.nudge{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:17;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.nudge-in{max-width:520px;margin:0 auto;background:var(--night);color:var(--night-fg);border-radius:16px;padding:14px;display:grid;grid-template-columns:52px 1fr;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.nudge-in .appic{width:52px;height:52px;border-radius:12px;background:#fff;display:grid;place-items:center}
.nudge-in .appic img{width:44px}
.nudge-in b{display:block;font-size:16px}
.nudge-in p{margin:2px 0 10px;font-size:14px;color:var(--night-muted)}
.nudge-in .row button{border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;border:0}
.nudge-in .yes{background:var(--fire);color:#fff}
.nudge-in .no{background:transparent;color:var(--night-fg);border:1px solid rgba(255,255,255,.3)!important}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.home{background:linear-gradient(160deg,#3a4a6b,#1f2a40);border-radius:22px;padding:22px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;max-width:330px;margin:0 auto;width:100%}
.home div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#fff;min-width:0}
.home i{width:52px;height:52px;border-radius:13px;display:block}
.home .fs i{background:#fff center/80% no-repeat;box-shadow:0 0 0 3px var(--fire)}
.home .fs{font-weight:700}
</style>

   <section class="sec"><h3>${esc(t("data"))}</h3><div class="data">${l.data.map(d=>`<div><i>${esc(d[0])}</i>${esc(d[1])}</div>`).join("")}</div></section>
   <section class="sec"><h3>${esc(t("notes"))}</h3><p class="hint">${esc(t("notesHint"))}</p><textarea id="note-${l.lot}" rows="3" placeholder="${esc(t("notePh"))}">${esc(S.notes[l.lot]||"")}</textarea><div class="saved" id="saved"></div></section>
   <section class="sec"><h3>${esc(t("ask"))}</h3><p class="hint">${esc(t("askHint"))}</p>${qa}${asked}<input type="text" id="ask-${l.lot}" placeholder="${esc(t("askPh"))}"><div class="row"><button class="btn primary" data-ask="${l.lot}">${esc(t("send"))}</button></div></section>
   <section class="sec"><h3>${esc(t("share"))}</h3><div class="sharebox" id="shareTxt">${esc(share)}</div><div class="row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(share)}" target="_blank" rel="noopener">${esc(t("share"))}</a><button class="btn" data-copy>${esc(t("copy"))}</button></div></section>`}
function compare(){const [a,b]=S.cmp.map(n=>LOTS.find(l=>l.lot===n));
  const row=(lab,x,y,w)=>`<tr><th>${esc(lab)}</th><td class="${w==="a"?"win":""}">${esc(x)}</td><td class="${w==="b"?"win":""}">${esc(y)}</td></tr>`;
  const wa=watchers(a),wb=watchers(b);
  return `<div class="grab"><div class="cname">${esc(t("compareTitle"))}</div><button class="close" data-close>${esc(t("close"))}</button></div>
   <div style="overflow-x:auto"><table class="ctable"><tr><th></th><td><b>Lot ${a.lot}<br>${esc(a.name)}</b></td><td><b>Lot ${b.lot}<br>${esc(b.name)}</b></td></tr>
   ${[0,1,2].map(i=>row(a.figs[i][1]===b.figs[i][1]?a.figs[i][1]:a.figs[i][1]+" / "+b.figs[i][1],a.figs[i][0],b.figs[i][0])).join("")}
   ${row("Sire",a.parents[0].name+" "+(a.parents[0].horn||""),b.parents[0].name+" "+(b.parents[0].horn||""))}
   ${row("Dam",a.parents[1].name+" "+(a.parents[1].horn||""),b.parents[1].name+" "+(b.parents[1].horn||""))}
   ${row(t("navList"),String(wa),String(wb),wa>wb?"a":wb>wa?"b":"")}</table></div>`}

function waView(){
  return `<div class="simnote"><b>${esc(t("simTitle"))}</b><span>${esc(t("simText"))}</span>
   <div class="row"><div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="${S.lang==="en"}">EN</button><button data-lang="af" aria-pressed="${S.lang==="af"}">AF</button></div><strong style="color:var(--fire)">${esc(t("simTap"))} ↓</strong></div></div>
  <div class="phone"><div class="wa-h"><span aria-hidden="true" style="font-size:20px">‹</span><span class="av"><img src="${IMG.logoL}" alt=""></span><div><b>Fire Sky Ankole</b><small>online</small></div></div>
   <div class="wa-body"><span class="wa-day">${S.lang==="af"?"Vandag":"Today"}</span>
    <div class="bub"><button class="lp tapme" data-enter><img src="${IMG.maxiHero}" alt=""><span><strong>${esc(t("lpTitle"))}</strong><em>${esc(t("lpDesc"))}</em><small>${esc(t("lpSite"))}</small></span></button>
     <p>${esc(t("waMsg"))}</p><p><a class="wl" href="#catalogue" data-enter>tuinmuso.github.io/firesky</a></p><span class="tm">07:30</span></div>
   </div><div class="wa-in"><span>${esc(t("typeMsg"))}</span><i></i></div></div>`}
function welcome(){
  return `<div class="welcome" style="display:flex;flex-direction:column;gap:16px;padding-bottom:8px">
   <div class="grab"><span><img class="logo-l" src="${IMG.logoL}" alt="Fire Sky Ankole" style="width:70px"><img class="logo-d" src="${IMG.logoD}" alt="" style="width:70px"></span><button class="close" data-close>${esc(t("close"))}</button></div>
   <h2>${esc(t("wTitle"))}</h2><p class="lead">${esc(t("wLead"))}</p>
   <ol class="steps"><li><span class="ico">${ICON.scroll}</span>${esc(t("w1"))}</li><li><span class="ico">${ICON.tap}</span>${esc(t("w2"))}</li><li><span class="ico">${ICON.heart}</span>${esc(t("w3"))}</li></ol>
   <button class="ghost-btn" id="bigBtn2">A+ &nbsp;${esc(t("wBig"))}</button>
   <button class="big-btn" data-close>${esc(t("wGo"))}</button></div>`}
function nudge(){
  return `<div class="nudge-in"><span class="appic"><img src="${IMG.logoL}" alt=""></span><div><b>${esc(t("nT"))}</b><p>${esc(t("nP"))}</p>
   <div class="row"><button class="yes" id="nYes">${esc(t("nYes"))}</button><button class="no" id="nNo">${esc(t("nNo"))}</button></div></div></div>`}
function install(){
  const os=instOS, can=!!deferredPrompt&&os==="android";
  const st=os==="ios"?[[ICON.share,t("iI1")],[ICON.plus,t("iI2")],[ICON.check,t("iI3")]]:can?[[ICON.phone,t("iA1")],[ICON.plus,t("iA2")],[ICON.check,t("iA3")]]:[[ICON.dots,t("iM1")],[ICON.plus,t("iM2")],[ICON.check,t("iM3")]];
  const apps=["#34c759","#ff9500","#5856d6","#ff2d55","#0a84ff","#30b0c7","#ffcc00"].map(c=>`<div><i style="background:${c}"></i></div>`);
  apps.splice(5,0,`<div class="fs"><i style="background-image:url('${IMG.logoL}')"></i>Fire Sky</div>`);
  return `<div class="inst" style="display:flex;flex-direction:column;gap:16px;padding-bottom:8px">
   <div class="grab"><span></span><button class="close" data-close>${esc(t("close"))}</button></div>
   <h2>${esc(t("iTitle"))}</h2><p class="lead">${esc(t("iLead"))}</p>
   <div class="seg" role="group"><button data-os="ios" aria-pressed="${os==="ios"}">${esc(t("iPhone"))}</button><button data-os="android" aria-pressed="${os==="android"}">${esc(t("iAndroid"))}</button></div>
   <ol class="steps">${st.map((x,i)=>`<li><span class="ico">${x[0]}</span><span><small style="color:var(--fire);font-weight:700">${i+1}.</small> ${esc(x[1])}</span></li>`).join("")}</ol>
   ${can?`<button class="big-btn" id="doInstall">${esc(t("iAdd"))}</button>`:""}
   <div><p class="reassure" style="margin-bottom:8px">${esc(t("yourScreen"))}</p><div class="home">${apps.join("")}</div></div>
   <p class="reassure">${esc(t("iNo"))}</p><button class="ghost-btn" data-close>${esc(t("iDone"))}</button></div>`}
function render(){document.documentElement.lang=S.lang;$("#t-title").textContent=t("title");$("#t-demo").textContent=t("demo");
  $("#lang-af").setAttribute("aria-pressed",S.lang==="af");$("#lang-en").setAttribute("aria-pressed",S.lang==="en");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll(".nav [data-tab]").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const lb=$("#listBadge");lb.hidden=!S.fav.length;lb.textContent=S.fav.length;
  document.body.classList.toggle("sim",S.tab==="wa");document.body.classList.toggle("big",!!S.big);$("#bigBtn").setAttribute("aria-pressed",!!S.big);$("#toWa").textContent=t("toWa");
  $("#view").innerHTML={wa:waView,cat:catalogue,list:myList,live:live,dash:dash}[S.tab]();
  const nd=$("#nudge");nd.hidden=!(S.tab!=="wa"&&S.opened>0&&!S.nudged&&$("#sheet").hidden);if(!nd.hidden)nd.innerHTML=nudge();
  $("#tray").hidden=S.cmp.length<1;$("#cmpBtn").textContent=S.cmp.length===2?t("compareN")(2):t("compareN")(S.cmp.length)+" (1/2)";}
let openLot=null;
function openSheet(h){$("#sheetIn").innerHTML=h;$("#sheet").hidden=false;$("#scrim").hidden=false;$("#sheet").scrollTop=0}
function closeSheet(){const wasLot=openLot!=null;$("#sheet").hidden=true;$("#scrim").hidden=true;openLot=null;if(wasLot){S.opened=(S.opened||0)+1;save()}render()}
function refresh(){if(openLot!=null)openSheet(sheet(LOTS.find(l=>l.lot===openLot)))}
document.addEventListener("click",e=>{const ent=e.target.closest("[data-enter]");if(ent){e.preventDefault();S.tab="cat";render();window.scrollTo(0,0);if(!S.welcomed){S.welcomed=true;save();openSheet(welcome())}return}
  const el=e.target.closest("button");if(!el)return;
  if(el.dataset.lang){S.lang=el.dataset.lang;save();render();return}
  if(el.id==="toWa"){S.tab="wa";closeSheet();window.scrollTo(0,0);return}
  if(el.id==="bigBtn"||el.id==="bigBtn2"){S.big=!S.big;save();render();if(el.id==="bigBtn2")openSheet(welcome());return}
  if(el.id==="helpBtn"){openSheet(welcome());return}
  if(el.id==="nYes"){S.nudged=true;save();render();openSheet(install());return}
  if(el.id==="nNo"){S.nudged=true;save();render();return}
  if(el.dataset.os){instOS=el.dataset.os;openSheet(install());return}
  if(el.id==="doInstall"&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;closeSheet()});return}
  if(el.id==="lang-af"||el.id==="lang-en"){S.lang=el.id.slice(5);save();render();refresh();return}
  if(el.dataset.tab){S.tab=el.dataset.tab;render();window.scrollTo(0,0);return}
  if(el.dataset.filter){S.filter=el.dataset.filter;render();return}
  if(el.dataset.fav){const n=el.dataset.fav;S.fav=S.fav.includes(n)?S.fav.filter(x=>x!==n):[...S.fav,n];save();render();refresh();return}
  if(el.dataset.open){openLot=el.dataset.open;refresh();return}
  if(el.hasAttribute("data-close")){closeSheet();return}
  if(el.hasAttribute("data-play")){el.classList.remove("playing");void el.offsetWidth;el.classList.add("playing");return}
  if(el.dataset.cmp){const n=el.dataset.cmp;S.cmp=S.cmp.includes(n)?S.cmp.filter(x=>x!==n):[...S.cmp,n].slice(-2);render();refresh();return}
  if(el.id==="cmpBtn"){if(S.cmp.length===2){openLot=null;openSheet(compare())}else{closeSheet();S.tab="cat";render()}return}
  if(el.dataset.ask){const n=el.dataset.ask,v=$("#ask-"+n).value.trim();if(!v)return;(S.asked[n]=S.asked[n]||[]).push(v);save();refresh();return}
  if(el.hasAttribute("data-copy")){const txt=$("#shareTxt").textContent;const sel=()=>{const r=document.createRange();r.selectNodeContents($("#shareTxt"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(txt).then(()=>{el.textContent=t("copied")},sel)}catch(err){sel()}return}
});
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
let nt;document.addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("note-")){S.notes[e.target.id.slice(5)]=e.target.value;clearTimeout(nt);nt=setTimeout(()=>{save();const s=$("#saved");if(s)s.textContent=t("saved")},400)}});
setInterval(()=>{const b=$("#bid");if(!b)return;const v=parseInt(b.textContent.replace(/\D/g,""));if(v<190000)b.textContent="R"+(v+5000).toLocaleString("en-ZA").replace(/,/g," ")},2500);
S.tab=(location.hash==="#catalogue")?"cat":"wa";render();
try{if("serviceWorker" in navigator&&location.hostname.endsWith("github.io"))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>

</body></html>
